<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - LibrosLibres Librería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="public/css/variables.css" rel="stylesheet">
  <link href="public/css/estilos.css" rel="stylesheet">
  <style>
    .register-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--brand-primary) 0%, #334155 100%);
      padding: 2rem 0;
    }
    .register-card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
    }
    .register-left {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #334155 100%);
      color: white;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .register-right {
      padding: 3rem;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-card">
      <div class="row g-0">
        <!-- Panel izquierdo -->
        <div class="col-md-5 register-left d-none d-md-flex">
          <div>
            <h2 class="mb-4" style="font-family: 'Playfair Display', serif;">
              <i class="bi bi-book-half me-2"></i>LibrosLibres Librería
            </h2>
            <p class="opacity-75">Crea tu cuenta para comprar libros digitales y acceder a tus descargas.</p>
            <hr class="border-secondary">
            <p class="small opacity-50">¿Ya tienes cuenta? Inicia sesión para continuar.</p>
            <a href="login.html" class="btn btn-outline-light btn-sm">
              <i class="bi bi-arrow-left me-1"></i>Iniciar Sesión
            </a>
          </div>
        </div>

        <!-- Panel derecho - Formulario -->
        <div class="col-md-7 register-right">
          <h3 class="mb-4" style="font-family: 'Playfair Display', serif; color: var(--brand-primary);">
            Crear Cuenta
          </h3>

          <!-- Alerta de error -->
          <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>

          <!-- Alerta de éxito -->
          <div id="alert-success" class="alert alert-success d-none" role="alert"></div>

          <form id="register-form">
            <!-- Nombre y Apellidos -->
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="reg-nombre" placeholder="Tu nombre" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Apellido Paterno *</label>
                <input type="text" class="form-control" id="reg-apellido-paterno" placeholder="Apellido paterno" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Apellido Materno</label>
                <input type="text" class="form-control" id="reg-apellido-materno" placeholder="Apellido materno">
              </div>
            </div>

            <!-- Tipo de documento y Número -->
            <div class="row">
              <div class="col-md-5 mb-3">
                <label class="form-label">Tipo de Documento *</label>
                <select class="form-select" id="reg-tipo-documento" required>
                  <option value="" selected>Seleccionar...</option>
                </select>
              </div>
              <div class="col-md-7 mb-3">
                <label class="form-label">Número de Documento *</label>
                <input type="text" class="form-control" id="reg-numero-documento" placeholder="Número de documento" required>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Correo electrónico *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="reg-email" placeholder="tu@email.com" required>
              </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
              <label class="form-label">Contraseña *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-3">
              <label class="form-label">Confirmar contraseña *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="reg-password-confirm" placeholder="Repite tu contraseña" required minlength="6">
              </div>
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
              <label class="form-label">Teléfono (opcional)</label>
              <input type="tel" class="form-control" id="reg-telefono" placeholder="Tu teléfono">
            </div>

            <!-- Dirección: Departamento → Provincia → Distrito -->
            <label class="form-label fw-bold">Ubicación</label>
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label small">Departamento *</label>
                <select class="form-select" id="reg-departamento" required>
                  <option value="" selected>Seleccionar...</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Provincia *</label>
                <select class="form-select" id="reg-provincia" required disabled>
                  <option value="" selected>Seleccionar...</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Distrito *</label>
                <select class="form-select" id="reg-distrito" required disabled>
                  <option value="" selected>Seleccionar...</option>
                </select>
              </div>
            </div>

            <!-- Dirección detallada -->
            <div class="mb-3">
              <label class="form-label">Dirección (calle, número, etc.)</label>
              <input type="text" class="form-control" id="reg-direccion" placeholder="Av. Principal 123">
            </div>

            <button type="submit" class="btn w-100 mb-3" id="btn-submit" style="background-color: var(--accent-color); color: #fff;">
              <span id="btn-text">Registrarse</span>
              <span id="btn-spinner" class="d-none">
                <span class="spinner-border spinner-border-sm me-2"></span>Creando cuenta...
              </span>
            </button>
          </form>

          <div class="text-center d-md-none">
            <p class="text-muted small">¿Ya tienes cuenta?</p>
            <a href="login.html" class="btn btn-outline-primary w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="public/js/config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(sessionStorage.getItem("user"));
      if (user) {
        window.location.href = "index.html";
        return;
      }

      cargarTiposDocumento();
      cargarDepartamentos();
      configurarFormularioRegistro();
      configurarTogglePassword();
    });

    // ── Cargar tipos de documento desde la tabla maestra ──
    async function cargarTiposDocumento() {
      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/tablas-maestras/TipoDocumento`);
        const data = await res.json();
        const select = document.getElementById("reg-tipo-documento");
        data.items.forEach(item => {
          const opt = document.createElement("option");
          opt.value = item.clave;
          opt.textContent = item.valor;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error("Error al cargar tipos de documento:", err);
      }
    }

    // ── Cargar departamentos ──
    async function cargarDepartamentos() {
      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/ubigeos/departamentos`);
        const data = await res.json();
        const select = document.getElementById("reg-departamento");
        data.departamentos.forEach(dep => {
          const opt = document.createElement("option");
          opt.value = dep.code;
          opt.textContent = dep.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error("Error al cargar departamentos:", err);
      }
    }

    // ── Cascada: Departamento → Provincias ──
    document.getElementById("reg-departamento").addEventListener("change", async function() {
      const codigo = this.value;
      const selectProvincia = document.getElementById("reg-provincia");
      const selectDistrito = document.getElementById("reg-distrito");

      selectProvincia.innerHTML = '<option value="" selected>Seleccionar...</option>';
      selectProvincia.disabled = true;
      selectDistrito.innerHTML = '<option value="" selected>Seleccionar...</option>';
      selectDistrito.disabled = true;

      if (!codigo) return;

      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/ubigeos/provincias/${codigo}`);
        const data = await res.json();
        data.provincias.forEach(prov => {
          const opt = document.createElement("option");
          opt.value = prov.code;
          opt.textContent = prov.name;
          selectProvincia.appendChild(opt);
        });
        selectProvincia.disabled = false;
      } catch (err) {
        console.error("Error al cargar provincias:", err);
      }
    });

    // ── Cascada: Provincia → Distritos ──
    document.getElementById("reg-provincia").addEventListener("change", async function() {
      const codigo = this.value;
      const selectDistrito = document.getElementById("reg-distrito");

      selectDistrito.innerHTML = '<option value="" selected>Seleccionar...</option>';
      selectDistrito.disabled = true;

      if (!codigo) return;

      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/ubigeos/distritos/${codigo}`);
        const data = await res.json();
        data.distritos.forEach(dist => {
          const opt = document.createElement("option");
          opt.value = dist.code;
          opt.textContent = dist.name;
          selectDistrito.appendChild(opt);
        });
        selectDistrito.disabled = false;
      } catch (err) {
        console.error("Error al cargar distritos:", err);
      }
    });

    // ── Obtener nombres de ubigeo para enviar al backend ──
    function obtenerNombresUbigeo() {
      const dep = document.getElementById("reg-departamento");
      const prov = document.getElementById("reg-provincia");
      const dist = document.getElementById("reg-distrito");

      return {
        departamentoCodigo: dep.value,
        provinciaCodigo: prov.value,
        distritoCodigo: dist.value,
        departamentoNombre: dep.options[dep.selectedIndex]?.text || "",
        provinciaNombre: prov.options[prov.selectedIndex]?.text || "",
        distritoNombre: dist.options[dist.selectedIndex]?.text || ""
      };
    }

    // ── Formulario de registro ──
    function configurarFormularioRegistro() {
      const form = document.getElementById("register-form");
      if (!form) return;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nombre = document.getElementById("reg-nombre").value.trim();
        const apellidoPaterno = document.getElementById("reg-apellido-paterno").value.trim();
        const apellidoMaterno = document.getElementById("reg-apellido-materno").value.trim();
        const tipoDocumento = document.getElementById("reg-tipo-documento").value;
        const numeroDocumento = document.getElementById("reg-numero-documento").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const passwordConfirm = document.getElementById("reg-password-confirm").value;
        const telefono = document.getElementById("reg-telefono").value.trim();
        const direccion = document.getElementById("reg-direccion").value.trim();

        const ubigeoInfo = obtenerNombresUbigeo();

        const btnSubmit = document.getElementById("btn-submit");
        const btnText = document.getElementById("btn-text");
        const btnSpinner = document.getElementById("btn-spinner");
        const alertError = document.getElementById("alert-error");
        const alertSuccess = document.getElementById("alert-success");

        alertError.classList.add("d-none");
        alertSuccess.classList.add("d-none");

        if (password !== passwordConfirm) {
          alertError.textContent = "Las contraseñas no coinciden";
          alertError.classList.remove("d-none");
          return;
        }

        btnText.classList.add("d-none");
        btnSpinner.classList.remove("d-none");
        btnSubmit.disabled = true;

        try {
          const response = await fetch(`${CONFIG.BACKEND_URL}/api/auth/registro`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nombre,
              apellido_paterno: apellidoPaterno,
              apellido_materno: apellidoMaterno,
              tipo_documento: tipoDocumento,
              numero_documento: numeroDocumento,
              departamento: ubigeoInfo.departamentoNombre,
              provincia: ubigeoInfo.provinciaNombre,
              distrito: ubigeoInfo.distritoNombre,
              ubigeo: ubigeoInfo.distritoCodigo,
              telefono,
              direccion,
              email,
              password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Error al registrarse");
          }

          alertSuccess.textContent = "Cuenta creada exitosamente. Redirigiendo al login...";
          alertSuccess.classList.remove("d-none");

          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);

        } catch (error) {
          alertError.textContent = error.message;
          alertError.classList.remove("d-none");
        } finally {
          btnText.classList.remove("d-none");
          btnSpinner.classList.add("d-none");
          btnSubmit.disabled = false;
        }
      });
    }

    function configurarTogglePassword() {
      const toggleBtn = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("reg-password");

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener("click", () => {
          const type = passwordInput.type === "password" ? "text" : "password";
          passwordInput.type = type;
          const icon = toggleBtn.querySelector("i");
          icon.className = type === "password" ? "bi bi-eye" : "bi bi-eye-slash";
        });
      }
    }
  </script>
</body>
</html>
